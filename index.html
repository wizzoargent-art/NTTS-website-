<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTTS Namibia</title>
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100 text-gray-900">

<!-- HEADER -->
<header class="bg-black text-white p-4 flex justify-between">
  <h1 class="font-bold text-xl">NTTS Namibia</h1>
</header>

<!-- HERO -->
<section class="p-10 text-center text-white bg-cover bg-center"
style="background-image:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470');">

  <div class="bg-black/60 p-10 rounded-xl">
    <h2 class="text-3xl font-bold">Explore Namibia with NTTS</h2>
    <p>4x4 Rentals • Safaris • Travel Experiences</p>
  </div>
</section>

<!-- VEHICLES -->
<section class="p-6">
  <h2 class="text-xl font-bold mb-4">Available Vehicles</h2>

  <div class="grid md:grid-cols-3 gap-4">

    <div class="bg-white p-4 shadow rounded">
      <h3 class="font-bold">Toyota Hilux</h3>
      <p>N$ 1200 / day</p>
      <button onclick="book('Toyota Hilux')" class="bg-green-600 text-white px-3 py-2 mt-2 rounded">
        Book Now
      </button>
    </div>

    <div class="bg-white p-4 shadow rounded">
      <h3 class="font-bold">Land Cruiser</h3>
      <p>N$ 1800 / day</p>
      <button onclick="book('Land Cruiser')" class="bg-green-600 text-white px-3 py-2 mt-2 rounded">
        Book Now
      </button>
    </div>

    <div class="bg-white p-4 shadow rounded">
      <h3 class="font-bold">SUV Comfort</h3>
      <p>N$ 900 / day</p>
      <button onclick="book('SUV')" class="bg-green-600 text-white px-3 py-2 mt-2 rounded">
        Book Now
      </button>
    </div>

  </div>
</section>

<!-- BOOKING FORM -->
<section class="p-6 bg-white">
  <h2 class="text-xl font-bold mb-4">Quick Booking</h2>

  <input id="name" placeholder="Full Name" class="border p-2 w-full mb-2">
  <input id="phone" placeholder="Phone Number" class="border p-2 w-full mb-2">
  <input id="dates" placeholder="Dates" class="border p-2 w-full mb-2">
  <input id="vehicle" placeholder="Vehicle Selected" class="border p-2 w-full mb-2">

  <button onclick="submitBooking()" class="bg-orange-500 text-white px-4 py-2 rounded">
    Submit Booking
  </button>
</section>

<!-- LIVE BOOKINGS -->
<section class="p-6">
  <h2 class="font-bold">Live Bookings</h2>
  <div id="list"></div>
</section>

<script>
/* =========================
   🔥 FIREBASE CONFIG
========================= */
const firebaseConfig = {
  apiKey: "AIzaSyDcGsPkONNgUlAqY4gZwTPtbXHg7qMyiNw",
  authDomain: "ntts-business.firebaseapp.com",
  projectId: "ntts-business",
  storageBucket: "ntts-business.firebasestorage.app",
  messagingSenderId: "814879443432",
  appId: "1:814879443432:web:9ee5e2a13927ff34ab3c5d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================
   🚗 SELECT VEHICLE
========================= */
function book(v){
  document.getElementById("vehicle").value = v;
}

/* =========================
   💰 SUBMIT BOOKING
========================= */
async function submitBooking(){

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const dates = document.getElementById("dates").value;
  const vehicle = document.getElementById("vehicle").value;

  if(!name || !phone || !vehicle){
    alert("Please fill all fields");
    return;
  }

  const booking = {
    name,
    phone,
    dates,
    vehicle,
    status: "Pending",
    createdAt: new Date()
  };

  await db.collection("bookings").add(booking);

  loadBookings();

  let msg = `🚗 NTTS BOOKING%0AName: ${name}%0APhone: ${phone}%0AVehicle: ${vehicle}%0ADates: ${dates}`;

  window.open(`https://wa.me/264811481458?text=${msg}`, "_blank");

  alert("Booking sent!");
}

/* =========================
   📊 LOAD LIVE BOOKINGS
========================= */
function loadBookings(){

  const list = document.getElementById("list");

  db.collection("bookings")
    .orderBy("createdAt","desc")
    .onSnapshot(snapshot => {

      list.innerHTML = "";

      snapshot.forEach(doc => {
        const b = doc.data();

        list.innerHTML += `
          <div class="bg-white p-2 m-2 shadow rounded">
            <b>${b.name}</b><br>
            🚙 ${b.vehicle}<br>
            📅 ${b.dates}<br>
            📌 Status: ${b.status}
          </div>
        `;
      });

    });
}

/* =========================
   🚀 START SYSTEM
========================= */
loadBookings();

</script>

</body>
</html>
